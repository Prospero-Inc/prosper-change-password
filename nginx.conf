# Per-IP request cap so scraping/flooding can't run up bandwidth costs on
# a free-tier instance. 10r/s steady-state with a burst allowance of 20
# covers a real user loading the page + its assets; sustained abuse past
# that gets 503s instead of being served.
limit_req_zone $binary_remote_addr zone=changepassword:10m rate=10r/s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    limit_req zone=changepassword burst=20 nodelay;
    limit_req_status 429;

    # Client-side routing (wouter): any path that isn't a real file falls
    # back to index.html so the SPA's own router handles it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets are safe to cache aggressively; index.html is not
    # (it references the current hashed filenames and must always be fresh).
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
