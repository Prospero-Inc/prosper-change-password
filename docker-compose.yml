services:
  app:
    container_name: prospero-change-password
    image: prospero-change-password
    build:
      context: ./
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL}
    ports:
      - '5173:80'
    networks:
      - prospero

networks:
  prospero:
    external: true
